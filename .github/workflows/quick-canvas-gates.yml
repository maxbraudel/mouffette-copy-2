name: qml-application-gates

on:
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/quick-canvas-gates.yml'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  push:
    branches:
      - main
      - master
    paths:
      - 'client/**'
      - '.github/workflows/quick-canvas-gates.yml'

jobs:
  qml-application-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enforce the QML-only application architecture
        working-directory: client
        run: |
          chmod +x ./tools/check_architecture_boundaries.sh
          ./tools/check_architecture_boundaries.sh

      - name: Run deterministic data and input contracts
        working-directory: client
        run: |
          node tests/baseline/run_baseline_checks.js
          node tests/baseline/run_phase2_interaction_parity.js
          node tests/baseline/run_phase2_interaction_ownership.js
          node tests/baseline/run_phase8_randomized_input_sequences.js
          node tests/baseline/run_render_schema_v2.js
